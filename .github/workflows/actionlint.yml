name: Workflow lint (actionlint + ShellCheck)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'first' }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select changed workflows (PR) or full workflow set (push/manual)
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/workflow-files"
          : > "$output"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Missing pull request base SHA"
              exit 1
            fi
            git diff --name-only --diff-filter=ACMR -z "$PR_BASE_SHA" HEAD -- .github/workflows > "${RUNNER_TEMP}/workflow-candidates"
          else
            git ls-files -z .github/workflows > "${RUNNER_TEMP}/workflow-candidates"
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                [[ -f "$path" ]] && printf '%s\0' "$path" >> "$output"
                ;;
            esac
          done < "${RUNNER_TEMP}/workflow-candidates"
          if [[ -s "$output" ]]; then
            echo "lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "lint=false" >> "$GITHUB_OUTPUT"
            echo "No changed workflows; report a successful check without downloads."
          fi

      - name: Install checksum-verified actionlint
        if: steps.scope.outputs.lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Install checksum-verified ShellCheck
        if: steps.scope.outputs.lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.11.0"
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP" "shellcheck-v${version}/shellcheck"

      - name: Validate workflows and shell snippets
        if: steps.scope.outputs.lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d "" -t workflows < "$RUNNER_TEMP/workflow-files"
          "$RUNNER_TEMP/actionlint" -oneline -pyflakes= \
            -shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" \
            "${workflows[@]}"
