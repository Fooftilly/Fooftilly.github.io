name: Astro migration preview (build only)

on:
  pull_request:
    branches: [master]
  push:
    branches: ["astro-migration/**"]

permissions:
  contents: read

concurrency:
  group: astro-preview-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'first' }}
  cancel-in-progress: true

jobs:
  astro-preview:
    # PR status is the candidate branch-protection context. Keep branch-push
    # runs visible without producing a second check of the same name/SHA.
    name: ${{ github.event_name == 'pull_request' && 'Astro staging checks' || 'Astro branch staging checks (non-required)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        working-directory: astro
        run: npm ci --no-audit --no-fund

      - name: Verify development server cannot serve private audit data
        working-directory: astro
        run: node scripts/verify-dev-audit.mjs

      - name: Validate source bookmark inventory
        working-directory: astro
        run: npm test

      - name: Check Astro and TypeScript
        working-directory: astro
        run: npm run check

      - name: Verify real media rendering with disposable CI-only records
        working-directory: astro
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-media-build-fixture.mjs

      - name: Build static preview (never deploy)
        working-directory: astro
        run: npm run build

      - name: Verify public build has no internal migration audit endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -s astro/.audit/bookmarks-parity.json
          test ! -e astro/dist/migration-audit
          test -s astro/dist/index.xml

      - name: Verify all Astro-loaded bookmarks against source frontmatter
        working-directory: astro
        run: npm run test:parity

      - name: Verify every bookmark detail URL and notes page
        working-directory: astro
        run: npm run test:routes

      - name: Verify root and category RSS feed parity
        run: python3 astro/scripts/verify_bookmark_feeds.py

      - name: Validate bilingual About Markdown and language navigation
        run: python3 astro/scripts/verify-localized-about.py

      - name: Verify localized posts and search pages
        run: python3 astro/scripts/verify-posts-search.py

      - name: Verify localized production homepage sections
        working-directory: astro
        run: node scripts/verify-homepage.mjs

      - name: Test internal-link audit rules
        run: |
          python3 -m unittest discover -s astro/scripts -p 'test_verify_internal_links.py'
          python3 -m unittest discover -s astro/scripts -p 'test_verify_projects.py'

      - name: Validate sitemap, SEO metadata and original static assets
        run: python3 astro/scripts/verify-site-seo.py

      - name: Validate rendered first-party film, music and TV media records
        working-directory: astro
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_media.py'
          python3 scripts/verify_media.py

      - name: Smoke-test hydrated search in Chromium
        working-directory: astro
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/smoke-search-browser.mjs

      - name: Validate production revision stamp without publishing
        working-directory: astro
        env:
          ASTRO_RELEASE_INTENT: publish
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-revision.txt
          node scripts/release-readiness.mjs
          rm dist/deploy-revision.txt

      - name: Record read-only release preflight manifest
        working-directory: astro
        run: node scripts/release-readiness.mjs

      - name: Check staged output routes
        shell: bash
        run: |
          set -euo pipefail
          test -s astro/dist/index.html
          test -s astro/dist/404.html
          test -s astro/dist/bookmarks/index.html
          test -s astro/dist/new-bookmark/index.html
          test -s astro/dist/music/index.html
          test -s astro/dist/films/index.html
          test -s astro/dist/tv/index.html
          test -s astro/dist/media/index.html
          test -s astro/dist/new-media/index.html
          test -s astro/dist/projects/index.html
          test -s astro/dist/sh/projects/index.html
          test -s astro/dist/projects/prks/index.html
          test -s astro/dist/projects/kokoro-extension/index.html
          test -s astro/dist/projects/local-search-mcp/index.html
          test -s astro/dist/privacy/index.html
          test -s astro/dist/sh/privacy/index.html
          test -s astro/dist/about/index.html
          test -s astro/dist/sh/index.html
          test -s astro/dist/sh/about/index.html
          test -s astro/dist/posts/index.html
          test -s astro/dist/sh/posts/index.html
          test -s astro/dist/search/index.html
          test -s astro/dist/sh/search/index.html
          test -s astro/dist/bookmarks/art/index.html
          test -s astro/dist/bookmarks/paperbookarticle/index.html
          test -s astro/dist/bookmarks/index.xml
          test -s astro/dist/index.xml
          test ! -e astro/dist/migration-audit
          test -s astro/dist/sitemap.xml
          test -s astro/dist/CNAME
          test -s astro/dist/favicon.svg
          # Assert that the generated browser really consumes legacy Markdown,
          # not just that the filesystem inventory test passes.
          grep -Fq '50 Watts' astro/dist/bookmarks/index.html
          grep -Fq 'https://50watts.com/' astro/dist/bookmarks/index.html
          grep -Fq '2048 by Gabriele Cirulli' astro/dist/bookmarks/index.html
          echo "Astro preview includes legacy bookmark records; publication disabled."
