name: Astro migration preview (build only)

on:
  pull_request:
    branches: [master]
  push:
    branches: ["astro-migration/**"]

permissions:
  contents: read

concurrency:
  group: astro-preview-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'first' }}
  cancel-in-progress: true

jobs:
  astro-preview:
    name: Astro staging checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        working-directory: astro
        run: npm ci --no-audit --no-fund

      - name: Validate legacy bookmark inventory
        working-directory: astro
        run: npm test

      - name: Check Astro and TypeScript
        working-directory: astro
        run: npm run check

      - name: Build static preview (never deploy)
        working-directory: astro
        run: npm run build

      - name: Verify all Astro-loaded bookmarks against source frontmatter
        working-directory: astro
        run: npm run test:parity

      - name: Verify every bookmark detail URL and notes page
        working-directory: astro
        run: npm run test:routes

      - name: Verify root and category RSS feed parity
        run: python3 astro/scripts/verify_bookmark_feeds.py

      - name: Check staged output routes
        shell: bash
        run: |
          set -euo pipefail
          test -s astro/dist/index.html
          test -s astro/dist/bookmarks/index.html
          test -s astro/dist/about/index.html
          test -s astro/dist/bookmarks/art/index.html
          test -s astro/dist/bookmarks/paperbookarticle/index.html
          test -s astro/dist/bookmarks/index.xml
          # Assert that the generated browser really consumes legacy Markdown,
          # not just that the filesystem inventory test passes.
          grep -Fq '50 Watts' astro/dist/bookmarks/index.html
          grep -Fq 'https://50watts.com/' astro/dist/bookmarks/index.html
          grep -Fq '2048 by Gabriele Cirulli' astro/dist/bookmarks/index.html
          echo "Astro preview includes legacy bookmark records; publication disabled."
