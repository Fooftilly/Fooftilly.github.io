name: Dependency review (advisory)

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".gitmodules"
      - "themes/**"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          warn-only: true
          license-check: false
          show-patched-versions: true
