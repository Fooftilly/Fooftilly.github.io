# Build every PR before deployment. Only master publishes to GitHub Pages.
name: Build and deploy Hugo site

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Checkout (including Hugo theme submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Hugo Extended
        run: |
          curl --fail --location --retry 3 \
            --output "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg --install "${{ runner.temp }}/hugo.deb"
          hugo version
      - name: Install Dart Sass Embedded
        run: sudo snap install dart-sass-embedded
      - name: Run JavaScript tests if present
        run: |
          if compgen -G 'tests/*.test.mjs' > /dev/null; then
            node --test tests/*.test.mjs
          fi
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify
      - name: Check key generated pages
        run: |
          test -s public/index.html
          test -s public/bookmarks/index.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
