name: One-time MusicBrainz ID normalization (delete before merge)
on:
  push:
    branches: [feat/import-verified-rym-albums]
permissions:
  contents: write
jobs:
  verify-music:
    name: Verify unique source IDs and compact URLs
    if: github.ref == 'refs/heads/feat/import-verified-rym-albums'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the music import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify all imported album identities and convert legacy source links
        run: node astro/scripts/check-album-identities.once.mjs --write
      - name: Commit normalized public album IDs on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- content/media/music; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- content/media/music
            git commit -m 'Normalize album release-group links to compact IDs'
            git push origin HEAD:refs/heads/feat/import-verified-rym-albums
          fi
